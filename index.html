<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aquecimento de hoje</title>
  <meta name="description" content="Controle do aquecimento diário das contas de Instagram e TikTok de cada app.">
  <meta name="theme-color" content="#f1ecff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14122b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Aquecimento de hoje</h1>
        <p class="today-date" id="todayDate"></p>
      </div>
      <span class="sync" id="sync" role="status" aria-live="polite"></span>
    </header>

    <!-- Login -->
    <section class="card login" id="login" hidden>
      <h2>Entrar</h2>
      <p class="muted">Use o mesmo e-mail no celular e no computador para ver tudo sincronizado.</p>
      <form id="emailForm" class="stack">
        <label for="email">Seu e-mail</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="voce@email.com">
        <button class="btn primary" type="submit">Enviar link de acesso</button>
      </form>
      <form id="codeForm" class="stack" hidden>
        <p class="muted" id="sentMsg"></p>
        <label for="code">Ou digite o código do e-mail</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="10">
        <button class="btn primary" type="submit">Entrar com código</button>
        <button class="btn ghost" type="button" id="backToEmail">Usar outro e-mail</button>
      </form>
      <p class="error" id="loginError" role="alert"></p>
    </section>

    <!-- App -->
    <main id="main" hidden>
      <section class="card summary" id="summary" aria-live="polite"></section>
      <section id="apps" class="apps"></section>
      <button class="btn add-app" id="addApp" type="button">+ Adicionar app</button>

      <section class="history">
        <h2>Histórico por dia</h2>
        <div id="history" class="history-list"></div>
      </section>

      <footer class="foot" id="foot"></footer>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
